<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070c" />
      <stop offset="50%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>

    <!-- Platinum Gradient for Title -->
    <linearGradient id="platinumText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f1f5f9" />
      <stop offset="80%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.02)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseAura {
      0%, 100% { opacity: 0.12; transform: scale(1); }
      50% { opacity: 0.22; transform: scale(1.08); }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0.3; }
    }
    .status-dot {
      animation: blink 2s infinite ease-in-out;
    }
    .aura-circle {
      animation: pulseAura 8s infinite ease-in-out;
      transform-origin: center;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="920" height="280" rx="16" fill="url(#canvasBg)" />
  <rect width="920" height="280" rx="16" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="80" r="130" fill="#6366f1" opacity="0.12" filter="url(#softGlow)" class="aura-circle" />
  <circle cx="750" cy="200" r="140" fill="#38bdf8" opacity="0.1" filter="url(#softGlow)" class="aura-circle" />

  <!-- Outer Hairline Border -->
  <rect x="1" y="1" width="918" height="278" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Top Badge / Organization Indicator -->
  <g transform="translate(48, 38)">
    <rect x="0" y="0" width="220" height="26" rx="13" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <circle cx="14" cy="13" r="3.5" fill="#38bdf8" class="status-dot" />
    <text x="26" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">FOUNDER · SPIRE DIGITAL</text>
  </g>

  <!-- Right Pill: Availability -->
  <g transform="translate(735, 38)">
    <rect x="0" y="0" width="138" height="26" rx="13" fill="rgba(56, 189, 248, 0.06)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />
    <circle cx="14" cy="13" r="3.5" fill="#4ade80" />
    <text x="26" y="17" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">OPEN TO INQUIRIES</text>
  </g>

  <!-- Main Headline: Rehan Perera -->
  <g transform="translate(48, 115)">
    <text x="0" y="0" fill="url(#platinumText)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">
      Rehan Perera
    </text>
  </g>

  <!-- Editorial Subheading -->
  <g transform="translate(48, 148)">
    <text x="0" y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" letter-spacing="0.5">
      Full-Stack Engineer <tspan fill="#475569">·</tspan> AI/ML Architect <tspan fill="#475569">·</tspan> Creative Technologist
    </text>
  </g>

  <!-- Accent Divider Line -->
  <line x1="48" y1="172" x2="872" y2="172" stroke="url(#accentLine)" stroke-width="1.2" opacity="0.6" />

  <!-- Core Proposition Statement -->
  <g transform="translate(48, 208)">
    <text x="0" y="0" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" letter-spacing="0.2">
      Architecting high-performance digital platforms and applied machine learning systems.
    </text>
    <text x="0" y="24" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400">
      Bridging low-latency computational engineering with refined, world-class user experiences.
    </text>
  </g>

  <!-- Right Discipline Tags -->
  <g transform="translate(680, 218)">
    <rect x="0" y="0" width="88" height="22" rx="4" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <text x="44" y="15" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.8">SYSTEMS</text>

    <rect x="96" y="0" width="96" height="22" rx="4" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <text x="144" y="15" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.8">APPLIED AI</text>
  </g>
</svg>
