<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 280" width="100%" height="100%">
  <defs>
    <radialGradient id="matrixBg" cx="50%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#0b101c" />
      <stop offset="60%" stop-color="#060911" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <linearGradient id="subtleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)" />
      <stop offset="50%" stop-color="rgba(99,102,241,0.2)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)" />
    </linearGradient>
  </defs>

  <style>
    .cat-header {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }
    .tech-pill {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.2px;
      fill: #e2e8f0;
    }
    .tech-box {
      fill: rgba(255, 255, 255, 0.03);
      stroke: rgba(255, 255, 255, 0.08);
      stroke-width: 1;
      rx: 6px;
    }
  </style>

  <!-- Canvas Frame -->
  <rect width="940" height="280" rx="16" fill="url(#matrixBg)" />
  <rect x="1" y="1" width="938" height="278" rx="15" fill="none" stroke="url(#subtleBorder)" stroke-width="1.2" />

  <!-- Section Header -->
  <g transform="translate(36, 36)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="18" font-weight="800" letter-spacing="-0.3">
      TECHNICAL ARSENAL &amp; CAPABILITIES
    </text>
    <text x="360" y="-1" fill="#64748b" font-family="'SF Mono', monospace" font-size="11" letter-spacing="1">/// PRODUCTION ARCHITECTURES</text>
  </g>

  <line x1="36" y1="52" x2="904" y2="52" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />

  <!-- Column 1: Core Systems & Languages -->
  <g transform="translate(36, 75)">
    <text x="0" y="12" fill="#38bdf8" class="cat-header">SYSTEMS &amp; LANGUAGES</text>

    <!-- C -->
    <g transform="translate(0, 26)">
      <rect width="130" height="32" class="tech-box" />
      <circle cx="16" cy="16" r="4" fill="#00599C" />
      <text x="30" y="20" class="tech-pill">C (Low-Level)</text>
    </g>

    <!-- Python -->
    <g transform="translate(140, 26)">
      <rect width="130" height="32" class="tech-box" />
      <circle cx="16" cy="16" r="4" fill="#3776AB" />
      <text x="30" y="20" class="tech-pill">Python</text>
    </g>

    <!-- TypeScript -->
    <g transform="translate(0, 68)">
      <rect width="130" height="32" class="tech-box" />
      <circle cx="16" cy="16" r="4" fill="#3178C6" />
      <text x="30" y="20" class="tech-pill">TypeScript</text>
    </g>

    <!-- JavaScript -->
    <g transform="translate(140, 68)">
      <rect width="130" height="32" class="tech-box" />
      <circle cx="16" cy="16" r="4" fill="#F7DF1E" />
      <text x="30" y="20" class="tech-pill">JavaScript</text>
    </g>

    <!-- SQL & Bash -->
    <g transform="translate(0, 110)">
      <rect width="130" height="32" class="tech-box" />
      <circle cx="16" cy="16" r="4" fill="#4479A1" />
      <text x="30" y="20" class="tech-pill">PostgreSQL / SQL</text>
    </g>

    <g transform="translate(140, 110)">
      <rect width="130" height="32" class="tech-box" />
      <circle cx="16" cy="16" r="4" fill="#4EAA25" />
      <text x="30" y="20" class="tech-pill">Linux &amp; Bash</text>
    </g>
  </g>

  <!-- Column 2: Frameworks & Applied AI -->
  <g transform="translate(335, 75)">
    <text x="0" y="12" fill="#818cf8" class="cat-header">FRAMEWORKS &amp; APPLIED AI</text>

    <!-- Next.js -->
    <g transform="translate(0, 26)">
      <rect width="130" height="32" class="tech-box" />
      <circle cx="16" cy="16" r="4" fill="#ffffff" />
      <text x="30" y="20" class="tech-pill">Next.js (App)</text>
    </g>

    <!-- React -->
    <g transform="translate(140, 26)">
      <rect width="130" height="32" class="tech-box" />
      <circle cx="16" cy="16" r="4" fill="#61DAFB" />
      <text x="30" y="20" class="tech-pill">React</text>
    </g>

    <!-- FastAPI -->
    <g transform="translate(0, 68)">
      <rect width="130" height="32" class="tech-box" />
      <circle cx="16" cy="16" r="4" fill="#009688" />
      <text x="30" y="20" class="tech-pill">FastAPI</text>
    </g>

    <!-- Node.js / Express -->
    <g transform="translate(140, 68)">
      <rect width="130" height="32" class="tech-box" />
      <circle cx="16" cy="16" r="4" fill="#339933" />
      <text x="30" y="20" class="tech-pill">Node.js / Express</text>
    </g>

    <!-- PyTorch -->
    <g transform="translate(0, 110)">
      <rect width="130" height="32" class="tech-box" />
      <circle cx="16" cy="16" r="4" fill="#EE4C2C" />
      <text x="30" y="20" class="tech-pill">PyTorch (AI/ML)</text>
    </g>

    <!-- Tailwind CSS -->
    <g transform="translate(140, 110)">
      <rect width="130" height="32" class="tech-box" />
      <circle cx="16" cy="16" r="4" fill="#06B6D4" />
      <text x="30" y="20" class="tech-pill">Tailwind CSS</text>
    </g>
  </g>

  <!-- Column 3: Cloud & Edge Infrastructure -->
  <g transform="translate(634, 75)">
    <text x="0" y="12" fill="#c084fc" class="cat-header">CLOUD &amp; INFRASTRUCTURE</text>

    <!-- AWS -->
    <g transform="translate(0, 26)">
      <rect width="130" height="32" class="tech-box" />
      <circle cx="16" cy="16" r="4" fill="#FF9900" />
      <text x="30" y="20" class="tech-pill">Amazon Web Serv.</text>
    </g>

    <!-- Docker -->
    <g transform="translate(140, 26)">
      <rect width="130" height="32" class="tech-box" />
      <circle cx="16" cy="16" r="4" fill="#2496ED" />
      <text x="30" y="20" class="tech-pill">Docker</text>
    </g>

    <!-- Cloudflare -->
    <g transform="translate(0, 68)">
      <rect width="130" height="32" class="tech-box" />
      <circle cx="16" cy="16" r="4" fill="#F38020" />
      <text x="30" y="20" class="tech-pill">Cloudflare Edge</text>
    </g>

    <!-- Vercel -->
    <g transform="translate(140, 68)">
      <rect width="130" height="32" class="tech-box" />
      <circle cx="16" cy="16" r="4" fill="#ffffff" />
      <text x="30" y="20" class="tech-pill">Vercel</text>
    </g>

    <!-- Git & CI/CD -->
    <g transform="translate(0, 110)">
      <rect width="130" height="32" class="tech-box" />
      <circle cx="16" cy="16" r="4" fill="#F05032" />
      <text x="30" y="20" class="tech-pill">Git / GitHub</text>
    </g>

    <!-- Scalable Microservices -->
    <g transform="translate(140, 110)">
      <rect width="130" height="32" class="tech-box" />
      <circle cx="16" cy="16" r="4" fill="#38BDF8" />
      <text x="30" y="20" class="tech-pill">Microservices</text>
    </g>
  </g>
</svg>
