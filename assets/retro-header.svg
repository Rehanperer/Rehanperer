<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <!-- CRT Screen Gradient Background -->
    <linearGradient id="crtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#080e1e" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Glowing Cyan/Green Neon Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="50%" stop-color="#39ff14" />
      <stop offset="100%" stop-color="#00f3ff" />
    </linearGradient>

    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>

    <linearGradient id="magentaNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>

    <!-- Phosphor Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100%" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="900" y2="0" stroke="rgba(0, 243, 255, 0.04)" stroke-width="1.5" />
    </pattern>

    <!-- CRT Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 243, 255, 0.03)" stroke-width="0.8" />
    </pattern>
  </defs>

  <style>
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes scanlineAnim {
      0% { transform: translateY(0); }
      100% { transform: translateY(320px); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 4px #00f3ff); }
      50% { opacity: 1; filter: drop-shadow(0 0 12px #39ff14); }
    }
    @keyframes equalizer {
      0%, 100% { height: 6px; }
      50% { height: 22px; }
    }
    @keyframes typingText1 {
      0% { opacity: 0; }
      10% { opacity: 1; }
      100% { opacity: 1; }
    }
    @keyframes badgePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    .retro-font {
      font-family: 'Courier New', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 13px;
      letter-spacing: 0.8px;
    }
    .header-title {
      font-family: 'Courier New', 'Fira Code', monospace;
      font-weight: 900;
      font-size: 32px;
      letter-spacing: 3px;
    }
    .cursor {
      animation: cursorBlink 0.9s infinite;
    }
    .pulse-glow {
      animation: pulseGlow 3s infinite ease-in-out;
    }
    .eq-bar {
      animation: equalizer 1.4s infinite ease-in-out;
    }
  </style>

  <!-- Outer CRT Terminal Frame -->
  <rect x="2" y="2" width="896" height="316" rx="14" fill="url(#crtBg)" stroke="#1a2638" stroke-width="2" />
  <rect x="2" y="2" width="896" height="316" rx="14" fill="url(#grid)" />
  <rect x="2" y="2" width="896" height="316" rx="14" fill="url(#scanlines)" />

  <!-- Window Header Bar -->
  <rect x="2" y="2" width="896" height="38" rx="14" fill="#0c1322" stroke="#1f2d42" stroke-width="1" />
  <rect x="2" y="24" width="896" height="16" fill="#0c1322" /> <!-- Flatten bottom radius of header -->

  <!-- Terminal Window Controls (Arcade Style Buttons) -->
  <circle cx="28" cy="20" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.8" />
  <circle cx="48" cy="20" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.8" />
  <circle cx="68" cy="20" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.8" />

  <!-- Terminal Title -->
  <text x="450" y="24" fill="#64748b" font-family="'Courier New', monospace" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.5">
    [ SYSTEM_TERMINAL // REHAN_PERERA_OS_v2.6.4 // PORT: 8080 ]
  </text>

  <!-- Status Chip (Right) -->
  <g transform="translate(740, 11)">
    <rect x="0" y="0" width="138" height="18" rx="4" fill="rgba(57, 255, 20, 0.1)" stroke="#39ff14" stroke-width="0.8" />
    <circle cx="10" cy="9" r="3.5" fill="#39ff14" class="cursor" />
    <text x="20" y="13" fill="#39ff14" font-family="'Courier New', monospace" font-size="10" font-weight="700" letter-spacing="0.5">SYS_ONLINE 99.9%</text>
  </g>

  <!-- Left Accent Tech Bracket -->
  <path d="M 24 55 L 14 55 L 14 300 L 24 300" fill="none" stroke="#00f3ff" stroke-width="1.8" opacity="0.6" />
  <path d="M 876 55 L 886 55 L 886 300 L 876 300" fill="none" stroke="#00f3ff" stroke-width="1.8" opacity="0.6" />

  <!-- Terminal Body Content -->
  <!-- Prompt Line 1: Boot Sequence -->
  <g transform="translate(36, 72)" class="retro-font">
    <text x="0" y="0" fill="#ff007f" font-weight="700">&gt;&gt; BOOT_SEQUENCE:</text>
    <text x="145" y="0" fill="#94a3b8">INIT_NEURAL_CORE... [</text>
    <text x="315" y="0" fill="#39ff14" font-weight="700">OK</text>
    <text x="335" y="0" fill="#94a3b8">] // LOAD_AGENCY_MODULE: </text>
    <text x="530" y="0" fill="#00f3ff" font-weight="700">SPIRE_DIGITAL</text>
    <text x="645" y="0" fill="#94a3b8">[</text>
    <text x="655" y="0" fill="#39ff14" font-weight="700">MOUNTED</text>
    <text x="720" y="0" fill="#94a3b8">]</text>
  </g>

  <!-- Massive Name Header with Neon Phosphor Glow -->
  <g transform="translate(36, 126)">
    <text x="0" y="0" fill="url(#neonCyan)" class="header-title pulse-glow" filter="url(#glow)">REHAN PERERA</text>
    
    <!-- Retro Cybernetic Badge -->
    <g transform="translate(350, -25)">
      <rect x="0" y="0" width="165" height="24" rx="4" fill="rgba(255, 0, 127, 0.15)" stroke="#ff007f" stroke-width="1" />
      <text x="82" y="16" fill="#ff007f" font-family="'Courier New', monospace" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">ARCHITECT // DEV</text>
    </g>
  </g>

  <!-- Subtitle: Roles -->
  <g transform="translate(36, 160)" class="retro-font">
    <text x="0" y="0" fill="#00f3ff" font-weight="700">&gt; ROLE_MATRIX:</text>
    <text x="125" y="0" fill="#f8fafc" font-weight="600">FULL-STACK ENGINEER</text>
    <text x="290" y="0" fill="#64748b">|</text>
    <text x="305" y="0" fill="#39ff14" font-weight="600">AI/ML ARCHITECT</text>
    <text x="445" y="0" fill="#64748b">|</text>
    <text x="460" y="0" fill="#ffb703" font-weight="600">CREATIVE TECHNOLOGIST</text>
  </g>

  <!-- Divider Line -->
  <line x1="36" y1="180" x2="864" y2="180" stroke="rgba(0, 243, 255, 0.15)" stroke-dasharray="4, 4" stroke-width="1" />

  <!-- Terminal Diagnostics Grid -->
  <!-- Col 1: Mission Directive -->
  <g transform="translate(36, 212)" class="retro-font">
    <text x="0" y="0" fill="#ffb703" font-weight="700">CURRENT_MISSION:</text>
    <text x="145" y="0" fill="#e2e8f0">Scaling </text>
    <text x="215" y="0" fill="#00f3ff" font-weight="700">Spire Digital</text>
    <text x="330" y="0" fill="#94a3b8">(Next-Gen Web &amp; AI Engineering)</text>

    <text x="0" y="24" fill="#39ff14" font-weight="700">CORE_TAGLINE:   </text>
    <text x="145" y="24" fill="#cbd5e1">"Architecting intelligent neural systems &amp; immersive web realities."</text>

    <text x="0" y="48" fill="#ff007f" font-weight="700">BASE_LOCATION:  </text>
    <text x="145" y="48" fill="#94a3b8">Earth // Global Remote // Ready for Deployment</text>
    <rect x="525" y="38" width="8" height="13" fill="#00f3ff" class="cursor" />
  </g>

  <!-- Right Graphic: Retro Audio/Data Frequency Waveform -->
  <g transform="translate(730, 205)">
    <rect x="0" y="0" width="134" height="68" rx="6" fill="#070c18" stroke="#1e293b" stroke-width="1" />
    <text x="12" y="16" fill="#64748b" font-family="'Courier New', monospace" font-size="9" font-weight="700">TELEMETRY_FREQ</text>
    
    <!-- Animated Equalizer Bars -->
    <g transform="translate(14, 52)">
      <rect x="0" y="-12" width="6" height="12" fill="#00f3ff" class="eq-bar" style="animation-delay: 0.1s;" />
      <rect x="10" y="-20" width="6" height="20" fill="#00f3ff" class="eq-bar" style="animation-delay: 0.4s;" />
      <rect x="20" y="-28" width="6" height="28" fill="#39ff14" class="eq-bar" style="animation-delay: 0.2s;" />
      <rect x="30" y="-16" width="6" height="16" fill="#39ff14" class="eq-bar" style="animation-delay: 0.6s;" />
      <rect x="40" y="-32" width="6" height="32" fill="#ffb703" class="eq-bar" style="animation-delay: 0.3s;" />
      <rect x="50" y="-22" width="6" height="22" fill="#ffb703" class="eq-bar" style="animation-delay: 0.5s;" />
      <rect x="60" y="-14" width="6" height="14" fill="#ff007f" class="eq-bar" style="animation-delay: 0.7s;" />
      <rect x="70" y="-26" width="6" height="26" fill="#ff007f" class="eq-bar" style="animation-delay: 0.15s;" />
      <rect x="80" y="-18" width="6" height="18" fill="#00f3ff" class="eq-bar" style="animation-delay: 0.35s;" />
      <rect x="90" y="-8" width="6" height="8" fill="#39ff14" class="eq-bar" style="animation-delay: 0.55s;" />
      <rect x="100" y="-15" width="6" height="15" fill="#00f3ff" class="eq-bar" style="animation-delay: 0.25s;" />
    </g>
  </g>

  <!-- Bottom Scanline Bar -->
  <g transform="translate(36, 298)" class="retro-font">
    <text x="0" y="0" fill="#475569" font-size="10">SYS_LOG: BUFFER_OPTIMAL | STACK_READY | ENCRYPTION: AES-256 | LATENCY: 12ms</text>
  </g>
</svg>
